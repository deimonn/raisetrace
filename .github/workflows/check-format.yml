name: Check format
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/check-format.yml'
      - '.indent.pro'
      - 'check_format.sh'
      - '**.c'
      - '**.h'
  push:
    branches:
      - '*'
    paths:
      - '.github/workflows/check-format.yml'
      - '.indent.pro'
      - 'check_format.sh'
      - '**.c'
      - '**.h'
jobs:
  check-format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch dependencies
        run: sudo apt install -y indent

      - name: Check format
        run: ./check_format.sh
